[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "NPY"]
ignore = ["N803", "N806", "E741"]  # allow math-style names such as A, N, S, I, R

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
# seeded legacy np.random calls are kept so the scripts reproduce the numbers in the reports
"assignment-*/*.py" = ["NPY002"]
